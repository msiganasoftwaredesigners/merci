{% extends 'base.html' %}
{% load static %}
{% block title %}Payment{% endblock title %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-lg shadow-lg">
        <h1 class="text-2xl font-bold text-center mb-6">Payment</h1>
        <p class="text-center text-lg font-semibold text-gray-900 mb-4">Total Amount: {{ total_amount }} birr</p>
        <div class="flex flex-col gap-4">
            <form method="POST" action="{% url 'payment' registration.id %}">
                {% csrf_token %}
                <button type="submit" name="pay_with_chapa" class="bg-blue-500 text-white font-semibold py-2 px-4 rounded-lg w-full hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Pay with Chapa
                </button>
            </form>
            <form method="POST" action="{% url 'payment' registration.id %}">
                {% csrf_token %}
                <button type="submit" name="pay_with_bank" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-lg w-full hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
                    Pay with Bank Account
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
